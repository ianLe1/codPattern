plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.cdp'
version = '0.8.6b-1.21.1-port'
base { archivesName = 'codpattern' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.253'

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        codpattern {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // 1.21.1 本地生产 jar（SRG 命中数=0，生产名即官方名，可直接参与编译）
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.3'

    // TaCZ 依赖的数学库（TaCZ 自带 jarjar，运行期提供）
    compileOnly 'org.apache.commons:commons-math3:3.6.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '3000'
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-removal'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'MixinConfigs'         : 'codpattern.mixins.json',
            'Specification-Title'  : 'COD Pattern',
            'Specification-Version': project.version,
            'Implementation-Title' : 'codpattern',
            'Implementation-Version': project.version,
    ])
}
